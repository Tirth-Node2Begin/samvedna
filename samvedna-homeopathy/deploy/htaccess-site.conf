# Samvedna - docroot .htaccess for samvedna.node2begin.com
#
# One docroot holds two things: the Next.js static export (index.html, _next/,
# blog/<slug>/) and the Core PHP backend (admin/, api/, uploads/). Apache serves
# the PHP natively, which is why next.config.ts no longer needs any rewrites.
#
# Copied to the docroot as .htaccess by scripts/build-live.ps1.
# Every directive is wrapped in <IfModule> so a host missing a module degrades
# instead of returning 500.

Options -Indexes +FollowSymLinks
ServerSignature Off
DirectoryIndex index.html index.php

# --------------------------------------------------------------------------
# 1. Hidden files and sensitive paths
# --------------------------------------------------------------------------
# .env, .git, editor swap files. .well-known is exempt - cPanel AutoSSL uses it
# to renew the certificate, and blocking it silently breaks HTTPS renewal.
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteRule "(^|/)\.(?!well-known(/|$))" - [F,L]
</IfModule>

# Server-side includes, config and migrations must never be fetchable.
RedirectMatch 404 ^/?(config|includes|migrations)(/|$)

<FilesMatch "\.(sql|md|bat|log|ini|sh|bak|old|orig|dist|local\.php)$">
    Require all denied
</FilesMatch>

# The dotfile rewrite above already blocks /.env; this catches it even if
# mod_rewrite is missing. Credentials must never be fetchable.
<FilesMatch "^\.env">
    Require all denied
</FilesMatch>

# --------------------------------------------------------------------------
# 2. Security headers
# --------------------------------------------------------------------------
<IfModule mod_headers.c>
    # Stop MIME sniffing turning an upload into an executable content type.
    Header always set X-Content-Type-Options "nosniff"

    # Clickjacking. frame-ancestors below is the modern equivalent; both are set
    # because older browsers only honour this one.
    Header always set X-Frame-Options "SAMEORIGIN"

    # Send the full URL same-origin, only the origin cross-origin.
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Features this site never uses. Denying them limits what injected script can do.
    # geolocation is allowed for THIS origin (self) so the pricing currency
    # detection (hooks/useCurrency.ts) can request the visitor's location; the
    # browser still shows the normal permission prompt before granting it.
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=(), interest-cohort=()"

    # Content-Security-Policy.
    #   script/style 'unsafe-inline': unavoidable here. A static export inlines its
    #     hydration payload in <script> tags and framer-motion writes inline styles;
    #     nonces would need a server to generate them per request.
    #   img flagcdn.com: country flags in WorldMap.tsx.
    #   img youtube.com/ytimg.com: video-testimonial poster thumbnails
    #     (https://img.youtube.com/vi/<id>/hqdefault.jpg, which redirects to i.ytimg.com).
    #   frame youtube-nocookie/youtube: the testimonial player in VideoStoryModal.tsx.
    #   connect 'self': the admin JSON API and /api/leads.php are same-origin.
    #   connect ipwho.is/ipapi.co: IP geolocation for the pricing currency (INR vs USD).
    #   connect bigdatacloud.net: reverse-geocodes GPS coords to a country when the
    #     visitor grants the location prompt. All three are in hooks/useCurrency.ts.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://flagcdn.com https://img.youtube.com https://i.ytimg.com; font-src 'self' data:; connect-src 'self' https://ipwho.is https://ipapi.co https://api.bigdatacloud.net; frame-src https://www.youtube-nocookie.com https://www.youtube.com; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

    # Do not advertise the PHP version.
    Header always unset X-Powered-By
    Header always unset X-Pingback

    # HSTS - only meaningful over TLS, and only safe once HTTPS definitely works.
    # Enable together with the redirect in section 3.
    # Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" env=HTTPS
</IfModule>

<IfModule mod_php.c>
    php_flag expose_php Off
</IfModule>

# --------------------------------------------------------------------------
# 3. Force HTTPS
# --------------------------------------------------------------------------
# DISABLED BY DEFAULT. Turn this on only after https://samvedna.node2begin.com
# loads with a valid certificate (cPanel > SSL/TLS Status > AutoSSL). Enabling it
# before the cert exists makes the site unreachable rather than merely insecure.
# <IfModule mod_rewrite.c>
#     RewriteCond %{HTTPS} !=on
#     RewriteCond %{HTTP:X-Forwarded-Proto} !https
#     RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
# </IfModule>

# --------------------------------------------------------------------------
# 4. Routing
# --------------------------------------------------------------------------
<IfModule mod_rewrite.c>
    # --- PHP backend ------------------------------------------------------
    # Real files (api/*.php, uploads/*, admin assets) are served/executed as-is.
    RewriteCond %{REQUEST_FILENAME} -f
    RewriteRule ^ - [L]

    # Admin panel — branded as /samvedna (ADMIN_BASE in config.php). Every admin
    # URL (/samvedna, /samvedna/blogs/edit/3, /samvedna/assets/admin.css) goes
    # through the front controller, which maps the prefix onto the on-disk admin/
    # folder — the same thing router.php does under `php -S` locally.
    RewriteRule ^samvedna(/.*)?$ router.php [L]

    # Backward-compatibility: old /admin links redirect to the new /samvedna
    # prefix. 302 (not 301) so browsers do not cache it indefinitely.
    RewriteRule ^admin(/.*)?$ /samvedna$1 [R=302,L,NC]

    # --- Static export ----------------------------------------------------
    # trailingSlash:true means every page is <path>/index.html.
    RewriteCond %{REQUEST_FILENAME}/index.html -f
    RewriteRule ^ %{REQUEST_URI}/index.html [L]

    # Blog posts published after the last build have no prebuilt directory.
    # Serve the client-side fallback but keep the /blog/<slug> URL intact;
    # app/blog-view reads the slug back out of the address bar.
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^blog/[^/]+/?$ /blog-view/index.html [L]
</IfModule>

# Anything else that does not exist gets the exported 404 page.
ErrorDocument 404 /404.html

# --------------------------------------------------------------------------
# 5. Caching and compression
# --------------------------------------------------------------------------
<IfModule mod_headers.c>
    # Never cache the HTML shells, or a rebuild would not reach browsers that
    # already visited. The fingerprinted assets they reference are immutable.
    <FilesMatch "\.html$">
        Header set Cache-Control "public, max-age=0, must-revalidate"
    </FilesMatch>
    <FilesMatch "^(sw\.js|manifest\.json)$">
        Header set Cache-Control "public, max-age=0, must-revalidate"
    </FilesMatch>
</IfModule>

<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType text/css "access plus 1 year"
    ExpiresByType application/javascript "access plus 1 year"
    ExpiresByType text/javascript "access plus 1 year"
    ExpiresByType font/woff2 "access plus 1 year"
    ExpiresByType image/webp "access plus 30 days"
    ExpiresByType image/avif "access plus 30 days"
    ExpiresByType image/jpeg "access plus 30 days"
    ExpiresByType image/png "access plus 30 days"
    ExpiresByType image/svg+xml "access plus 30 days"
</IfModule>

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css text/plain text/xml
    AddOutputFilterByType DEFLATE application/javascript text/javascript
    AddOutputFilterByType DEFLATE application/json image/svg+xml
</IfModule>

# woff2/webp/avif are already compressed - re-compressing wastes CPU.
<IfModule mod_mime.c>
    AddType font/woff2 .woff2
    AddType image/webp .webp
    AddType image/avif .avif
</IfModule>
