
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:transparent;font-family:var(--font-sans)}
.app{display:flex;flex-direction:column;gap:0;padding:0 0 24px}
.flow-nav{display:flex;align-items:center;gap:0;padding:16px 16px 0;overflow-x:auto;flex-wrap:nowrap}
.flow-step{display:flex;align-items:center;gap:0;flex-shrink:0}
.step-btn{padding:6px 12px;font-size:11px;font-weight:500;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;white-space:nowrap;transition:all .15s}
.step-btn:first-child{border-radius:6px 0 0 6px}
.step-btn:last-child{border-radius:0 6px 6px 0}
.step-btn.active{background:#1D9E75;border-color:#1D9E75;color:#fff}
.step-arrow{font-size:12px;color:var(--color-text-secondary);padding:0 2px;flex-shrink:0}
.screen{margin:16px;border:0.5px solid var(--color-border-tertiary);border-radius:12px;background:var(--color-background-primary);overflow:hidden}
.screen-header{background:var(--color-background-secondary);border-bottom:0.5px solid var(--color-border-tertiary);padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.screen-title{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.screen-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500}
.badge-teal{background:#E1F5EE;color:#085041}
.badge-purple{background:#EEEDFE;color:#3C3489}
.badge-coral{background:#FAECE7;color:#712B13}
.badge-blue{background:#E6F1FB;color:#0C447C}
.badge-amber{background:#FAEEDA;color:#633806}
.badge-gray{background:var(--color-background-secondary);color:var(--color-text-secondary);border:0.5px solid var(--color-border-tertiary)}
@media(prefers-color-scheme:dark){
  .badge-teal{background:#04342C;color:#9FE1CB}
  .badge-purple{background:#26215C;color:#CECBF6}
  .badge-coral{background:#4A1B0C;color:#F5C4B3}
  .badge-blue{background:#042C53;color:#B5D4F4}
  .badge-amber{background:#412402;color:#FAC775}
}
.screen-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.form-row{display:grid;gap:10px}
.form-row.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}
.form-row.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-weight:500;color:var(--color-text-secondary)}
.field-val{font-size:12px;padding:6px 10px;border:0.5px solid var(--color-border-tertiary);border-radius:6px;background:var(--color-background-primary);color:var(--color-text-primary)}
.field-val.required{border-color:var(--color-border-info)}
.field-val.locked{background:var(--color-background-secondary);color:var(--color-text-secondary);font-style:italic}
.field-val.filled{background:var(--color-background-secondary)}
.field-val.warn{border-color:var(--color-border-warning);color:var(--color-text-warning)}
.field-val.success{border-color:var(--color-border-success);color:var(--color-text-success)}
.section-label{font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-secondary);padding-bottom:4px;border-bottom:0.5px solid var(--color-border-tertiary)}
.lock-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--color-text-secondary);padding:6px 10px;background:var(--color-background-secondary);border-radius:6px;border:0.5px solid var(--color-border-tertiary)}
.lock-icon{width:8px;height:8px;border-radius:1px;border:1.5px solid currentColor;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.pill{display:inline-flex;align-items:center;font-size:10px;font-weight:500;padding:2px 8px;border-radius:20px}
.pill-green{background:#E1F5EE;color:#085041}
.pill-red{background:#FCEBEB;color:#791F1F}
.pill-amber{background:#FAEEDA;color:#633806}
.pill-gray{background:var(--color-background-secondary);color:var(--color-text-secondary)}
@media(prefers-color-scheme:dark){
  .pill-green{background:#04342C;color:#9FE1CB}
  .pill-red{background:#501313;color:#F7C1C1}
  .pill-amber{background:#412402;color:#FAC775}
}
.checklist{display:flex;flex-direction:column;gap:4px}
.check-item{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--color-text-primary)}
.check-box{width:13px;height:13px;border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check-box.done{background:#1D9E75}
.check-box.todo{border:0.5px solid var(--color-border-secondary)}
.check-tick{width:7px;height:5px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.action-row{display:flex;gap:8px;margin-top:4px}
.btn-primary{font-size:12px;font-weight:500;padding:8px 16px;border-radius:6px;background:#1D9E75;color:#fff;border:none;cursor:pointer}
.btn-secondary{font-size:12px;font-weight:500;padding:8px 16px;border-radius:6px;background:transparent;color:var(--color-text-secondary);border:0.5px solid var(--color-border-secondary);cursor:pointer}
.btn-danger{font-size:12px;font-weight:500;padding:8px 16px;border-radius:6px;background:transparent;color:var(--color-text-danger);border:0.5px solid var(--color-border-danger);cursor:pointer}
.timeline-track{display:flex;align-items:flex-start;gap:0;padding:4px 0}
.tl-dot{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.tl-circle{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.tl-line{width:1px;height:30px;background:var(--color-border-tertiary);margin:0 auto}
.tl-content{padding:0 0 20px 12px;flex:1}
.tl-title{font-size:12px;font-weight:500;color:var(--color-text-primary)}
.tl-sub{font-size:11px;color:var(--color-text-secondary);margin-top:1px}
.progress-bar-wrap{height:6px;background:var(--color-background-secondary);border-radius:3px;overflow:hidden}
.progress-bar-fill{height:100%;border-radius:3px;background:#1D9E75}
.metric-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.metric{background:var(--color-background-secondary);border-radius:8px;padding:10px 12px;text-align:center}
.metric-val{font-size:18px;font-weight:500;color:var(--color-text-primary)}
.metric-lbl{font-size:10px;color:var(--color-text-secondary);margin-top:2px}
.divider{height:0.5px;background:var(--color-border-tertiary)}
.escalation-box{border:0.5px solid var(--color-border-warning);border-radius:8px;padding:12px;background:var(--color-background-warning)}
.escalation-title{font-size:12px;font-weight:500;color:var(--color-text-warning)}
.info-note{border:0.5px solid var(--color-border-info);border-radius:6px;padding:8px 12px;background:var(--color-background-info);font-size:11px;color:var(--color-text-info)}
.flow-hint{font-size:11px;color:var(--color-text-secondary);text-align:center;padding:8px 0 0}
.role-row{display:flex;gap:8px}
.role-chip{flex:1;border:0.5px solid var(--color-border-tertiary);border-radius:6px;padding:6px 8px;text-align:center}
.role-chip .role-name{font-size:11px;font-weight:500;color:var(--color-text-primary)}
.role-chip .role-type{font-size:10px;color:var(--color-text-secondary);margin-top:1px}
</style>

let current = 0;

function goTo(i){
  current = i;
  render();
}

function render(){
  const nav = document.getElementById('nav');
  nav.innerHTML = pages.map((p,i) => `
    <div class="flow-step">
      ${i>0?'<div class="step-arrow">›</div>':''}
      <button class="step-btn${i===current?' active':''}" onclick="goTo(${i})">${p.label}</button>
    </div>`).join('');

  const area = document.getElementById('screen-area');
  const p = pages[current];
  area.innerHTML = `
    <div class="screen">
      <div class="screen-header">
        <div class="screen-title">${p.title}</div>
        <div class="screen-badge ${p.badge}">${p.badgeText}</div>
      </div>
    </div>`;
  pages[current].render(area.querySelector('.screen'));

  document.getElementById('hint').textContent = p.next;
}

render();
